<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brandie Creative Blog</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0a0d12;
      color: #f7f5f4;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    a { color: #e8001c; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <script>
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const target = slug ? `./blog/post.html?slug=${encodeURIComponent(slug)}` : './blog/';
    window.location.replace(target);
  </script>
  <p>Redirecting to the latest article… <a href="./blog/">Open blog home</a></p>
</body>
</html>
